[project]
name = "recommender"
version = "0.1.0"
description = "End-to-end recommendation system using MovieLens data, PyTorch, DVC, MLflow and clean code practices."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "mateusValentim6D76", email = "mvalentimcloud@gmail.com" }
]
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "mlflow>=2.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recommender"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
    "httpx>=0.27",
    "dvc>=3.67.1",
]

[tool.pytest.ini_options]
testpaths = ["src/recommender/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
